name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 버전은 package.json 의 packageManager 를 단일 출처로 삼는다.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Export OpenAPI
        run: pnpm openapi:export

      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi/planforge-core.json

  docker:
    name: 이미지 빌드 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 배포 산출물이 실제로 빌드되는지 확인한다. 레지스트리에는 올리지 않는다 —
      # 발행은 release.yml 이 태그에서만 한다.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          # Docker 태그는 소문자만 허용한다. 리포 이름에는 대문자가 있어 그대로 쓸 수 없다.
          tags: planforge-core:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
